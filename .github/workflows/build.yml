name: Build DALUmagic VST3

on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar (descarga JUCE automaticamente)
        run: cmake -B build -A x64

      - name: Compilar VST3
        run: cmake --build build --config Release --target DALUmagic_VST3 --parallel

      - name: Empaquetar
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -Recurse "build/DALUmagic_artefacts/Release/VST3/DALUmagic.vst3" "dist/DALUmagic.vst3"

      - name: Subir resultado
        uses: actions/upload-artifact@v4
        with:
          name: DALUmagic-VST3-Windows
          path: dist
